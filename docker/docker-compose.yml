services:
  postgres:
    image: postgres:16-alpine
    container_name: transacta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: transacta
      POSTGRES_PASSWORD: transacta_dev
      POSTGRES_DB: transacta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transacta"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: